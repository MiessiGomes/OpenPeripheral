name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: fmt · clippy · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: System deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libusb-1.0-0-dev libudev-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: rustfmt
        run: cargo fmt --all --check

      - name: clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: test
        run: cargo test --all

  deb:
    name: pacote .deb
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: System deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libusb-1.0-0-dev libudev-dev dpkg-dev

      - uses: dtolnay/rust-toolchain@stable

      - name: cargo-deb
        run: cargo install cargo-deb --locked

      - name: build deb
        run: cargo deb

      - name: upload deb
        uses: actions/upload-artifact@v4
        with:
          name: openperipheral-deb
          path: target/debian/*.deb
