[package]
name = "duocast-ctl"
version = "0.1.0"
edition = "2021"
description = "OpenPeripheral: controle Linux de periféricos (HyperX DuoCast e outros)"
license = "MIT"
readme = "README.md"
publish = false
default-run = "duocast-ui"
repository = "https://github.com/MiessiGomes/OpenPeripheral"
homepage = "https://github.com/MiessiGomes/OpenPeripheral"
authors = ["MiessiGomes <josericardomgomes@gmail.com>"]

[lib]
name = "duocast"
path = "src/lib.rs"

[[bin]]
name = "duocast"
path = "src/main.rs"

[[bin]]
name = "duocast-ui"
path = "src/bin/duocast-ui.rs"

[dependencies]
anyhow = "1"
axum = "0.8"
clap = { version = "4", features = ["derive"] }
hidapi = { version = "2", default-features = false, features = ["linux-static-libusb"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
ureq = { version = "2", features = ["json"] }

[package.metadata.deb]
name = "openperipheral"
maintainer = "MiessiGomes <josericardomgomes@gmail.com>"
copyright = "2026 MiessiGomes"
license-file = ["LICENSE", "0"]
extended-description = """Painel Linux para periféricos reconstruídos por engenharia reversa.
O pacote instala regras udev do DuoCast e recarrega-as no postinst."""
depends = "$auto, udev, alsa-utils"
section = "utils"
priority = "optional"
assets = [
    ["target/release/duocast-ui", "usr/bin/openperipheral", "755"],
    ["target/release/duocast", "usr/bin/duocast", "755"],
    ["udev/99-hyperx-duocast.rules", "usr/lib/udev/rules.d/", "644"],
    ["packaging/openperipheral.desktop", "usr/share/applications/", "644"],
    ["README.md", "usr/share/doc/openperipheral/", "644"],
]
maintainer-scripts = "packaging/debian"
