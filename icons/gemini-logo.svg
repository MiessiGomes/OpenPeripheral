<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Gradientes -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    
    <linearGradient id="cyan-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="glow-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <!-- Filtro de Brilho (Glow Effect) -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Fundo Quadrado Estilo Ícone/Avatar -->
  <rect width="200" height="200" rx="40" fill="url(#bg-grad)" />
  
  <!-- Linhas de Circuito de Fundo Sptil -->
  <g stroke="#334155" stroke-width="1.5" fill="none" opacity="0.4">
    <path d="M 25 100 L 50 100 L 65 85" />
    <path d="M 50 150 L 75 150 L 90 135" />
    <path d="M 125 40 L 140 40 L 155 55" />
    <circle cx="25" cy="100" r="2.5" fill="#334155" />
    <circle cx="50" cy="150" r="2.5" fill="#334155" />
    <circle cx="125" cy="40" r="2.5" fill="#334155" />
  </g>

  <!-- ÍCONE DA LOGO -->
  <g transform="translate(0, 0)">
    <!-- Hexágono Base / Desmontado (Engenharia Reversa e Open Source) -->
    <path d="M 100 40 L 50 69 L 50 128 L 100 157 L 150 128" fill="none" stroke="url(#cyan-blue)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
    
    <!-- Lado Superior Aberto (Engenharia Reversa / Acesso Aberto) -->
    <path d="M 130 40 L 150 51.5 L 150 80" fill="none" stroke="#06b6d4" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="12 6" />

    <!-- Traços e Pinos Internos (Conexões / Firmware) -->
    <g stroke="url(#glow-cyan)" stroke-width="2.5" fill="none" stroke-linecap="round">
      <path d="M 100 98 L 100 65" />
      <path d="M 100 98 L 70 115" />
      <path d="M 100 98 L 130 115" stroke-dasharray="4 4" />
      
      <!-- Nós do Circuito -->
      <circle cx="100" cy="98" r="5" fill="#06b6d4" stroke="#0f172a" stroke-width="2" />
      <circle cx="100" cy="65" r="3.5" fill="#38bdf8" />
      <circle cx="70" cy="115" r="3.5" fill="#38bdf8" />
      <circle cx="130" cy="115" r="3.5" fill="#818cf8" />
    </g>

    <!-- Conector USB / Periférico -->
    <path d="M 150 51.5 L 165 42.5" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
    <circle cx="168" cy="40.5" r="3" fill="#38bdf8" />
  </g>
</svg>