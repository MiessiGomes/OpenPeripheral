<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="100%" height="100%">
  <defs>
    <!-- Gradientes -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    
    <linearGradient id="cyan-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="glow-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <!-- Filtro de Brilho (Glow Effect) -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Fundo do Card -->
  <rect width="800" height="240" rx="16" fill="url(#bg-grad)" />
  
  <!-- Linhas de Circuito de Fundo (Sutil) -->
  <g stroke="#334155" stroke-width="1.5" fill="none" opacity="0.4">
    <path d="M 60 120 L 110 120 L 130 100" />
    <path d="M 120 180 L 150 180 L 170 160" />
    <path d="M 150 60 L 180 60 L 200 80" />
    <circle cx="60" cy="120" r="3" fill="#334155" />
    <circle cx="120" cy="180" r="3" fill="#334155" />
    <circle cx="150" cy="60" r="3" fill="#334155" />
  </g>

  <!-- ÍCONE PRINCIPAL: Open / Reverse Engineering Hexagon -->
  <g transform="translate(40, 0)">
    <!-- Hexágono Aberto/Desmontado (Símbolo de Engenharia Reversa e Open Source) -->
    <!-- Lado Esquerdo e Base -->
    <path d="M 120 45 L 70 74 L 70 133 L 120 162 L 170 133" fill="none" stroke="url(#cyan-blue)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
    
    <!-- Lado Superior Aberto (Representando Desmontagem e Acesso Aberto) -->
    <path d="M 150 45 L 170 56.5 L 170 85" fill="none" stroke="#06b6d4" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="12 6" />

    <!-- Traços de Engenharia Reversa / Esquema -->
    <g stroke="url(#glow-cyan)" stroke-width="2.5" fill="none" stroke-linecap="round">
      <!-- Linhas de Dados Internas chamando periféricos -->
      <path d="M 120 103 L 120 70" />
      <path d="M 120 103 L 90 120" />
      <path d="M 120 103 L 150 120" stroke-dasharray="4 4" />
      
      <!-- Nós/Pinos de Circuito -->
      <circle cx="120" cy="103" r="5" fill="#06b6d4" stroke="#0f172a" stroke-width="2" />
      <circle cx="120" cy="70" r="3.5" fill="#38bdf8" />
      <circle cx="90" cy="120" r="3.5" fill="#38bdf8" />
      <circle cx="150" cy="120" r="3.5" fill="#818cf8" />
    </g>

    <!-- Símbolo do Conector USB / Periférico Universal no topo -->
    <path d="M 170 56.5 L 185 47.5" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
    <circle cx="188" cy="45.5" r="3" fill="#38bdf8" />
  </g>

  <!-- TIPOGRAFIA E TEXTO -->
  <!-- "Open" em destaque branco/clean -->
  <text x="260" y="125" font-family="system-ui, -apple-system, &#39;Segoe UI&#39;, Roboto, Helvetica, Arial, sans-serif" font-size="54" font-weight="800" fill="#f8fafc" letter-spacing="-0.5">Open</text>
  
  <!-- "Peripheral" em gradiente e tom de alta tecnologia -->
  <text x="395" y="125" font-family="system-ui, -apple-system, &#39;Segoe UI&#39;, Roboto, Helvetica, Arial, sans-serif" font-size="54" font-weight="300" fill="url(#glow-cyan)" letter-spacing="0.5">Peripheral</text>

  <!-- Subtítulo Explicativo -->
  <text x="262" y="160" font-family="system-ui, -apple-system, &#39;Segoe UI&#39;, Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#94a3b8" letter-spacing="2">REVERSE ENGINEERED PERIPHERAL SOFTWARE</text>

  <!-- Tags de Recursos/Recursos Visuais na parte inferior -->
  <g transform="translate(262, 180)">
    <!-- Badge 1: Open Source -->
    <rect x="0" y="0" width="105" height="22" rx="11" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <circle cx="11" cy="11" r="4" fill="#10b981" />
    <text x="22" y="15" font-family="sans-serif" font-size="11" font-weight="600" fill="#cbd5e1">OPEN SOURCE</text>

    <!-- Badge 2: Drivers / Firmware -->
    <rect x="115" y="0" width="85" height="22" rx="11" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <circle cx="126" cy="11" r="4" fill="#06b6d4" />
    <text x="137" y="15" font-family="sans-serif" font-size="11" font-weight="600" fill="#cbd5e1">DRIVERS</text>
  </g>
</svg>